# =====================================================================
# 更容易Eee (ShiftE+) — Nginx 反代設定檔
# 放置：/etc/nginx/sites-available/shifteee
# 啟用：sudo ln -s /etc/nginx/sites-available/shifteee /etc/nginx/sites-enabled/
# 測試：sudo nginx -t && sudo systemctl reload nginx
# 上 HTTPS（免費）：sudo certbot --nginx -d shifteee.com -d www.shifteee.com
#   （certbot 會自動把下面拆成 HTTP→HTTPS 跳轉 + 443 證書 block）
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name shifteee.com www.shifteee.com;

    # Let's Encrypt / certbot 驗證路徑
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / 長連線支援（WhatsApp bot 需要）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10m;
    }
}

